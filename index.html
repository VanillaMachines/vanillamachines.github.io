  <style>
    :root {
      --red: #FF0000;
      --white: #ffffff;
      --bg-fade: 2.4s;
      --slide-start: 2.9s;
      --slide: 0.8s;
      --drop-start: 3.5s;
      --drop: 1s;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--white);
      display: grid;
      place-items: center;
      padding: 16px;
      overflow: hidden;
      animation: bg-reveal var(--bg-fade) ease-in-out 0.4s both;
    }
    .logo { width: min(560px, 85vw); height: auto; overflow: visible; }
    /* SVG user units: the wave's centre sits 177 units left of the logo's centre */
    .wave { animation: wave-slide var(--slide) cubic-bezier(.65,0,.35,1) var(--slide-start) both; }
    .word { fill: #000; animation: drop-in var(--drop) linear var(--drop-start) both; }
    @keyframes bg-reveal {
      from { background-color: var(--red); }
      to   { background-color: var(--white); }
    }
    @keyframes wave-slide {
      from { transform: translateX(177px); }
      to   { transform: translateX(0); }
    }
    @keyframes drop-in {
      0%   { transform: translateY(-260px); opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      45%  { transform: translateY(0);      opacity: 1; animation-timing-function: cubic-bezier(0,.55,.45,1); }
      62%  { transform: translateY(-22px);             animation-timing-function: cubic-bezier(.55,0,1,.45); }
      78%  { transform: translateY(0);                 animation-timing-function: cubic-bezier(0,.55,.45,1); }
      88%  { transform: translateY(-6px);              animation-timing-function: cubic-bezier(.55,0,1,.45); }
      100% { transform: translateY(0);      opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      body, .wave, .word { animation: none; }
    }
  </style>
