<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vanilla Machines</title>
  <meta name="description" content="Vanilla Machines">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --red: #FF0000;
      --white: #ffffff;
      --bg-fade: 2.4s;
      --slide-start: 2.9s;
      --slide: 0.8s;
      --drop-start: 3.5s;
      --drop: 1.5s;
      --badge-start: 5s;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--white);
      display: grid;
      place-items: center;
      padding: 16px;
      overflow: hidden;
      animation: bg-reveal var(--bg-fade) ease-in-out 0.4s both;
    }
    .logo { width: min(560px, 85vw); height: auto; overflow: visible; }
    /* SVG user units: the wave's centre sits 177 units left of the logo's centre */
    .wave { animation: wave-slide var(--slide) cubic-bezier(.65,0,.35,1) var(--slide-start) both; }
    .word { fill: #222; transform-box: fill-box; transform-origin: 0% 100%; animation: drop-in var(--drop) linear var(--drop-start) both; }
    .badge {
      position: fixed;
      right: 16px;
      top: 16px;
      height: 15.6px;
      width: auto;
      fill: #222;
      animation: fade-in 0.8s ease-out var(--badge-start) both;
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes bg-reveal {
      from { background-color: var(--red); }
      to   { background-color: var(--white); }
    }
    @keyframes wave-slide {
      from { transform: translateX(177px); }
      to   { transform: translateX(0); }
    }
    @keyframes drop-in {
      0%   { transform: translateY(-260px) scaleY(1.2);  opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      30%  { opacity: 1; }
      38%  { transform: translateY(0)      scaleY(1.08); animation-timing-function: ease-out; }
      46%  { transform: translateY(0)      scaleY(0.75);  animation-timing-function: ease-in-out; }
      58%  { transform: translateY(-46px)  scaleY(1.14);  animation-timing-function: cubic-bezier(.55,0,1,.45); }
      67%  { transform: translateY(0)      scaleY(0.88);  animation-timing-function: ease-in-out; }
      76%  { transform: translateY(-14px)  scaleY(1.05); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      84%  { transform: translateY(0)      scaleY(0.96); animation-timing-function: ease-in-out; }
      92%  { transform: translateY(0)      scaleY(1.01); }
      100% { transform: none; opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      body, .wave, .word, .badge { animation: none; }
    }
  </style>
